# PostgreSQL configuration pg_delta needs, read by pgbrew.
#
# `pgx install` reports this; `pgx install --configure` writes it to a
# conf.d drop-in. It also travels inside a bottle, so a prebuilt install
# configures the server too.

[postgresql]
# pg_delta registers a background worker in _PG_init (the Delta Lake stream manager),
# so its library must be loaded at server start. Without this the extension
# installs and loads, but the worker never runs and it silently does nothing.
#
# This requirement is version-independent: a statically registered worker
# needs preloading on every PostgreSQL version.
shared_preload_libraries = true

# No [postgresql.settings] block on purpose. Every GUC below already has a
# working default, and writing defaults into postgresql.conf only creates
# drift when the extension later changes one. Add a settings block here for
# values that genuinely must differ for a deployment.
#
# Available settings:
#   delta.enabled
#   delta.batch_size
#   delta.poll_interval_ms
#   delta.flush_interval_ms
#   delta.worker_log_level
#   delta.aws_region
#   delta.aws_endpoint
#   delta.aws_access_key_id
#   delta.aws_secret_access_key
#   delta.azure_storage_account
#   delta.gcs_service_account_path

[package]
name = "pg_git"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Git version control backed by PostgreSQL tables"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "pgrx_embed_pg_git"
path = "./src/bin/pgrx_embed.rs"

[features]
default = ["pg16"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14", "pg_spi/pg14"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15", "pg_spi/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16", "pg_spi/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17", "pg_spi/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18", "pg_spi/pg18"]
pg_test = []

[dependencies]
pgrx.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "macros", "time", "process"] }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
hex.workspace = true
socket2 = { version = "0.5", features = ["all"] }
pg_spi = { git = "https://github.com/matroidbe/pg_extensions", default-features = false }

# Git operations (pure Rust)
gix = { version = "0.71", default-features = false, features = ["basic", "worktree-mutation"] }

# File metadata extraction
mime_guess = "2"

# HTTP server
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[dev-dependencies]
pgrx-tests = "0.16"
tokio-postgres.workspace = true
tempfile = "3"

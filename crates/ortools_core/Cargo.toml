[package]
name = "ortools_core"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Pure Rust optimization engine: MIP (HiGHS) and metaheuristic local search"

[features]
# Empty features for workspace compatibility with pgrx extensions
pg14 = []
pg15 = []
pg16 = []
pg17 = []
pg18 = []
# CP-SAT scheduling engine (opt-in). Off by default so the pg_ortools extension
# and existing MIP/metaheuristic builds do NOT pull Pumpkin's dependency tree.
# Enable with `--features cpsat`. See design/pg_ortools/cpsat-engine.md.
cpsat = ["dep:pumpkin-core", "dep:pumpkin-constraints", "dep:pumpkin-conflict-resolvers"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
good_lp = { version = "1.14", default-features = false, features = ["highs"] }
rand = "0.8"
# CP-SAT-class scheduling engine (lazy clause generation). Optional: only compiled
# under the `cpsat` feature. Depend on the lean companion crates directly, not the
# `pumpkin-solver` umbrella, to avoid its CLI / flatzinc / signal-hook / cc-checker
# build baggage. See design/pg_ortools/cpsat-engine.md.
pumpkin-core = { version = "0.4", optional = true }
pumpkin-constraints = { version = "0.4", optional = true }
pumpkin-conflict-resolvers = { version = "0.4", optional = true }

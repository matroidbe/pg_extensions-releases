[package]
name = "pg_streaming"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Declarative stream processing engine inside PostgreSQL"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "pgrx_embed_pg_streaming"
path = "src/bin/pgrx_embed.rs"

[features]
default = ["pg16"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14", "pg_spi/pg14", "pg_observability/pg14"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15", "pg_spi/pg15", "pg_observability/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16", "pg_spi/pg16", "pg_observability/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17", "pg_spi/pg17", "pg_observability/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18", "pg_spi/pg18", "pg_observability/pg18"]
pg_test = []

# Optional OpenDAL backends — opt-in to avoid pulling cloud SDK deps by default.
opendal-s3 = ["opendal/services-s3"]
opendal-gcs = ["opendal/services-gcs"]
opendal-azblob = ["opendal/services-azblob"]
opendal-sftp = ["opendal/services-sftp"]
opendal-ftp = ["opendal/services-ftp"]
opendal-webdav = ["opendal/services-webdav"]
opendal-all = ["opendal-s3", "opendal-gcs", "opendal-azblob", "opendal-sftp", "opendal-ftp", "opendal-webdav"]

# Built-in xarray connectors (xarray_index sink + xarray_header processor).
# Folded into pg_streaming rather than a separate cdylib extension so the
# two pgrx extensions don't collide on Pg_magic_func / _PG_init symbols at
# link time. Companion runtime extension: pg_xarray (separate, talks via
# SPI). The DSL still references them as { "custom": { "name": "..." } }.
xarray = []

[dependencies]
pgrx.workspace = true
tokio.workspace = true
thiserror.workspace = true
serde_json.workspace = true
serde.workspace = true
bytes.workspace = true
futures.workspace = true
async-trait = "0.1"
csv = "1.3"
flate2 = "1"
opendal = { version = "0.50", default-features = false, features = ["services-fs", "services-memory", "services-http"] }
glob = "0.3"
uuid = { version = "1", features = ["v7"] }
chrono.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
url = { workspace = true }
async-stream = "0.3"
pg_spi = { git = "https://github.com/matroidbe/pg_extensions", default-features = false }
pg_observability = { git = "https://github.com/matroidbe/pg_extensions", default-features = false }

# Shared Zarr v3 header walker — used by xarray_header processor so the
# pipeline path produces the same per-chunk bbox as pgx.register_file.
pgx_zarr_walker = { path = "../../crates/pgx_zarr_walker" }

[dev-dependencies]
pgrx-tests = "0.16"
tokio = { workspace = true, features = ["rt", "macros"] }
tokio-postgres.workspace = true

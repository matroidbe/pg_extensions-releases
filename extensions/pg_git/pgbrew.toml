# PostgreSQL configuration pg_git needs, read by pgbrew.
#
# `pgx install` reports this; `pgx install --configure` writes it to a
# conf.d drop-in. It also travels inside a bottle, so a prebuilt install
# configures the server too.

[postgresql]
# pg_git registers a background worker in _PG_init (the git HTTP server and sync workers),
# so its library must be loaded at server start. Without this the extension
# installs and loads, but the worker never runs and it silently does nothing.
#
# This requirement is version-independent: a statically registered worker
# needs preloading on every PostgreSQL version.
shared_preload_libraries = true

# The settings a deployment is expected to choose, at the code's defaults:
# which database the background workers connect to (it must hold the
# extension), and where they listen. `pgx install --configure` writes
# them to a conf.d drop-in; override at install time with
#   pgx install --configure --set pg_git.database=<database> ...
# A unit test keeps these equal to the code defaults (design/bgworker-config).
[postgresql.settings]
"pg_git.database" = "postgres"
"pg_git.http_port" = "5433"

# Available settings:
#   pg_git.enabled
#   pg_git.database
#   pg_git.http_port
#   pg_git.sync_interval
#   pg_git.default_repo_path
